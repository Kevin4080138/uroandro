name: Medical Content Hub scheduler

on:
  schedule:
    - cron: "0 4,15 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: medical-content-hub-production
  cancel-in-progress: false

jobs:
  run-medical-content-hub:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call production Medical Content Hub endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MEDICAL_NEWS_CRON_URL: ${{ secrets.MEDICAL_NEWS_CRON_URL }}
        shell: bash
        run: |
          missing=()
          [[ -z "$CRON_SECRET" ]] && missing+=("CRON_SECRET")
          [[ -z "$MEDICAL_NEWS_CRON_URL" ]] && missing+=("MEDICAL_NEWS_CRON_URL")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing GitHub Actions secrets: ${missing[*]}" >&2
            echo "Configure them in Repository settings > Secrets and variables > Actions." >&2
            exit 1
          fi

          curl --silent --show-error --fail-with-body \
            --connect-timeout 15 \
            --max-time 290 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${MEDICAL_NEWS_CRON_URL}"
