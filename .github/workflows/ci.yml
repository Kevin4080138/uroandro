name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testlar va tiplar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Bog'liqliklarni o'rnatish
        run: npm ci
      - name: Formula testlari (Vitest)
        run: npm test
      - name: TypeScript tekshiruvi
        run: npx tsc --noEmit
